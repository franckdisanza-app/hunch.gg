# Keeps dependencies and CI actions current. Minor and patch updates arrive grouped, once a week;
# majors come one by one so each gets its own CI run and review. next and eslint-config-next move
# together (they share a version), as do react, react-dom and their types.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Follows the Node major in .node-version and package.json engines, not the latest types.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

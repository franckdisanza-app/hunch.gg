name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (includes the SQL migration in PGlite)
        run: pnpm test
      - run: pnpm content:validate

  scaffold:
    name: pnpm new-game output typechecks and lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm new-game ci-scaffold --name "CI Scaffold" --engine choice
      - run: pnpm typecheck
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec prettier --check .
      - run: pnpm content:validate

  build:
    name: Build, bundle budget, e2e, Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ENABLE_DEV_ROUTES builds /dev and /dev/game-shell, which the budget and e2e tests need.
      - name: Build (content validation runs first)
        run: pnpm build
        env:
          ENABLE_DEV_ROUTES: "1"

      - name: First-load JavaScript budget
        run: pnpm size

      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse (mobile) on the shelf and the games
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          # Hidden games (Ping) serve their puzzles only with dev routes on, read at request time.
          ENABLE_DEV_ROUTES: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lhci-report/
          retention-days: 7
          if-no-files-found: ignore
